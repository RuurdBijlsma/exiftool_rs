[package]
name = "exiftool"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
description = "A Rust wrapper for ExifTool."
authors = ["Ruurd Bijlsma <ruurd@bijlsma.dev>"]
homepage = "https://github.com/ruurdbijlsma/exiftool_rs"
repository = "https://github.com/ruurdbijlsma/exiftool_rs"
readme = "README.md"
keywords = ["exif", "exiftool", "metadata", "image", "video"]
documentation = "https://docs.rs/exiftool/latest/exiftool/index.html"
exclude = [
    "data",
    ".github",
    "checks",
    ".idea",
]
categories = ["multimedia::images", "multimedia::video", "multimedia::audio", "command-line-utilities"]

[[bench]]
name = "exiftool"
harness = false

[dependencies]
thiserror = "^2.0.17"
tempfile = { version = "^3.23.0", default-features = false }
serde = { version = "^1.0.228", features = ["derive", "serde_derive"] }
serde_json = "^1.0.145"
serde_path_to_error = { version = "^0.1.20" }
chrono = { version = "^0.4.42", default-features = false }
log = "^0.4.28"

[dev-dependencies]
image = { version = "^0.25.8", features = ["jpeg"], default-features = false }
walkdir = "^2.5"
assert_matches = "^1.5.0"
criterion = { version = "^0.8.2", default-features = false }
