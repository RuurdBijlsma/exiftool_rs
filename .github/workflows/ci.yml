name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      exiftool-package: libimage-exiftool-perl
    steps:
      - uses: actions/checkout@v4

      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y ${{ env.exiftool-package }}

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (strict)
        run: |
          cargo clippy --all-features -- \
          -D warnings -W clippy::pedantic \
          -W clippy::nursery -W rust-2018-idioms \
          -A clippy::single-match-else

      - name: Check documentation
        run: cargo doc --no-deps --document-private-items

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            exiftool-package: libimage-exiftool-perl
          - os: macos-latest
            exiftool-package: exiftool
          - os: windows-latest
            exiftool-package: exiftool

    steps:
      - uses: actions/checkout@v4

      - name: Install exiftool (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.exiftool-package }}

      - name: Install exiftool (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ${{ matrix.exiftool-package }}

      - name: Install exiftool (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install ${{ matrix.exiftool-package }}

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --verbose
